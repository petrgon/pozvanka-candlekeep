    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        .font-header { font-family: 'Cinzel Decorative', serif; }
        .font-title { font-family: 'Cinzel', serif; }
        .font-body { font-family: 'Cormorant Garamond', serif; }
        .font-signature { font-family: 'Tangerine', cursive; }
        .font-medieval { font-family: 'MedievalSharp', cursive; }

        body {
            background-color: #0d0705;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 153, 51, 0.15) 0%, rgba(13, 7, 5, 0.95) 75%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 2px, transparent 2px, transparent 4px),
                linear-gradient(180deg, #180b06 0%, #080302 100%);
            min-height: 100vh;
            color: #2c1d11;
            overflow-x: hidden;
        }

        .candle-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(255, 170, 70, 0.18) 0%, rgba(210, 105, 30, 0.08) 45%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            animation: flicker 4s infinite alternate ease-in-out;
        }

        @keyframes flicker {
            0% { opacity: 0.8; transform: translate(-50%, -50%) scale(0.98); }
            25% { opacity: 1; transform: translate(-49%, -51%) scale(1.02); }
            50% { opacity: 0.85; transform: translate(-51%, -49%) scale(0.99); }
            75% { opacity: 0.95; transform: translate(-50%, -52%) scale(1.01); }
            100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.0); }
        }

        .parchment {
            background: #e8d3a7;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.3) 0%, rgba(180, 140, 90, 0.2) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.04' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.12'/%3E%3C/svg%3E");

                0 0 35px rgba(0, 0, 0, 0.9),
                inset 0 0 80px rgba(90, 50, 20, 0.45),
                inset 0 0 20px rgba(60, 30, 10, 0.6);
            border: 2px solid rgba(80, 40, 15, 0.5);
        }

        .parchment-card {
            background: rgba(232, 211, 167, 0.85);
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.2) 0%, rgba(180, 140, 90, 0.15) 100%);
            border: 1px solid rgba(120, 70, 30, 0.3);
            transition: all 0.3s ease;
        }

        .parchment-card:hover, .parchment-card.active-card {
            background: #f2e2ba;
            border-color: #8b0000;
            box-shadow: 0 4px 15px rgba(107, 9, 16, 0.25), inset 0 0 15px rgba(180, 140, 90, 0.3);
        }

        .drop-cap {
            float: left;
            font-family: 'Cinzel Decorative', serif;
            font-size: 3.2rem;
            line-height: 0.8;
            padding-top: 4px;
            padding-right: 8px;
            padding-left: 2px;
            color: #6b0910;
        }

        .rolled-highlight {
            background-color: rgba(218, 165, 32, 0.3) !important;
            border-left: 4px solid #8b0000 !important;
            font-weight: bold;
            transition: background-color 0.4s ease, border-left 0.4s ease;

            width: 8px;

            background: rgba(20, 10, 5, 0.6);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #5c3016;
            border-radius: 4px;
            border: 1px solid #8b5a2b;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8b4513;
        }

</head>

                    <button onclick="setCategoryFilter('all')" class="chip-btn active-chip px-2.5 py-1 rounded-md bg-amber-900/80 text-amber-200 border border-amber-600/60 transition" data-category="all">All (10)</button>
                    <button onclick="setCategoryFilter('Arcane & Dreams')" class="chip-btn px-2.5 py-1 rounded-md bg-black/40 text-amber-400/80 border border-amber-900/40 hover:bg-amber-950 transition" data-category="Arcane & Dreams">Arcane</button>

        /* State Variables */
        let selectedBackground = BACKGROUNDS_DATA[0];

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playPageTurnSound() {
            if (isAudioMuted) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.15;
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(500, now);
            filter.frequency.exponentialRampToValueAtTime(1200, now + 0.18);
            filter.Q.value = 2.0;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
            noise.start(now);
        }

        function playDiceSound() {
            if (isAudioMuted) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            for (let i = 0; i < 5; i++) {
                const delay = i * 0.06 + Math.random() * 0.02;
                const now = ctx.currentTime + delay;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200 + Math.random() * 300, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.05);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        function playChimeSound() {
            if (isAudioMuted) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            [523.25, 659.25, 783.99].forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.4);
            });
        }

        function renderBackgroundsList() {
            const container = document.getElementById('backgrounds-list');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            const filtered = BACKGROUNDS_DATA.filter(bg => {
                const matchesCategory = (currentCategoryFilter === 'all' || bg.category === currentCategoryFilter);

                return matchesCategory && matchesSearch;

            renderBackgroundsList();
            renderTomeDisplay();

        function renderTomeDisplay() {

            const container = document.getElementById('tome-display');

        function rollRandomTraits() {
            playDiceSound();
            const tIdx = Math.floor(Math.random() * 6);
            const iIdx = Math.floor(Math.random() * 6);
            const bIdx = Math.floor(Math.random() * 6);
            const fIdx = Math.floor(Math.random() * 6);

            rolledTraits = { tIdx, iIdx, bIdx, fIdx };
            renderTomeDisplay();
            showToast("Rolled d6 traits for " + selectedBackground.title + "!");

        function copyBackgroundSummary() {
            const bg = selectedBackground;
            let text = `=== CANDLEKEEP BACKGROUND: ${bg.title.toUpperCase()} ===\n`;
            text += `Category: ${bg.category}\n`;
            text += `Skills: ${bg.skills.join(', ')}\n`;
            text += `Tools: ${bg.tools.join(', ')}\n`;
            text += `Languages: ${bg.languages.join(', ')}\n`;
            text += `Equipment: ${bg.equipment}\n\n`;
            text += `FEATURE: ${bg.featureName}\n${bg.featureDesc}\n\n`;

            if (rolledTraits) {
                text += `=== ROLLED PROFILE (d6) ===\n`;
                text += `Trait: ${bg.traits[rolledTraits.tIdx]}\n`;
                text += `Ideal: ${bg.ideals[rolledTraits.iIdx]}\n`;
                text += `Bond: ${bg.bonds[rolledTraits.bIdx]}\n`;
                text += `Flaw: ${bg.flaws[rolledTraits.fIdx]}\n`;
            }

            // Clipboard copy with fallback
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    playChimeSound();
                    showToast("Background copied to clipboard!");
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            playChimeSound();
            showToast("Background copied to clipboard!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            const soundIcon = document.getElementById('sound-icon');
            const soundText = document.getElementById('sound-text');
            if (isAudioMuted) {
                soundIcon.className = 'fa-solid fa-volume-xmark text-red-400';
                soundText.innerText = 'Sound OFF';
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-amber-400';
                soundText.innerText = 'Sound ON';
                getAudioContext();
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Initialize on window load
        window.onload = function() {
            renderBackgroundsList();
            renderTomeDisplay();
        };
